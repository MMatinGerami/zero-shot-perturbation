[project]
name = "zsp"
version = "0.1.0"
description = "Zero-shot prediction of CRISPRi perturbation responses in unseen cell contexts, with per-prediction uncertainty"
readme = "README.md"
authors = [
    { name = "Matin Gerami", email = "mmatin.gerami@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anndata>=0.13.4",
    "cell-eval2>=0.16.0",
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "scanpy>=1.12.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "RUF", "PLW"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
